name: Apply review 4 sync fix

on:
  push:
    branches:
      - agent/multi-device-sync-v3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Harden exact sync commit recovery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-device-sync-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch
        run: |
          sed -i 's/read_text(encoding="utf-8")n$/read_text(encoding="utf-8")/' scripts/apply-review4-sync-fix.py
          python3 scripts/apply-review4-sync-fix.py
      - name: Validate patched files
        run: |
          node --check <(cat GoogleSheetSync.gs)
          cp GoogleSheetSync.gs GoogleSheetSync.js
          node tests/google-sheet-sync-v3.test.js
          rm GoogleSheetSync.js
      - name: Commit reviewed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GoogleSheetSync.gs tests/google-sheet-sync-v3.test.js SYNC_V3_MIGRATION.md
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Harden exact sync commit recovery"
          git push origin HEAD:agent/multi-device-sync-v3
