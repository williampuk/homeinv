name: Sync v3 tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser files
        run: |
          node --check sync-v3-core.js
          node --check sync-v3.js
          node --check service-worker.js
      - name: Run sync core tests
        run: node tests/sync-v3-core.test.js
