name: Sync v3 tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/multi-device-sync-v3' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-device-sync-v3
          fetch-depth: 0
      - name: Apply exact commit recovery patch
        run: |
          sed -i 's/read_text(encoding="utf-8")n$/read_text(encoding="utf-8")/' scripts/apply-review4-sync-fix.py
          python3 scripts/apply-review4-sync-fix.py
      - name: Commit reviewed patch when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GoogleSheetSync.gs tests/google-sheet-sync-v3.test.js SYNC_V3_MIGRATION.md
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Harden exact sync commit recovery"
          git push origin HEAD:agent/multi-device-sync-v3

  test:
    needs: apply-review-fix
    if: ${{ always() && (needs.apply-review-fix.result == 'success' || needs.apply-review-fix.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check synchronization files
        run: |
          node --check sync-v3-core.js
          node --check sync-v3.js
          node --check sync-v3-import-adapter.js
          node --check sync-v3-endpoint-guard.js
          node --check service-worker.js
          cp GoogleSheetSync.gs /tmp/GoogleSheetSync.js
          node --check /tmp/GoogleSheetSync.js
      - name: Run browser sync core tests
        run: node tests/sync-v3-core.test.js
      - name: Run browser sync integration tests
        run: node tests/sync-v3-browser-integration.test.js
      - name: Run Excel import adapter tests
        run: node tests/sync-v3-import-adapter.test.js
      - name: Run endpoint guard tests
        run: node tests/sync-v3-endpoint-guard.test.js
      - name: Run Apps Script sync tests
        run: |
          cp GoogleSheetSync.gs GoogleSheetSync.js
          node tests/google-sheet-sync-v3.test.js
          rm GoogleSheetSync.js
